<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #css {
      cursor: inherit;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

  </style>

  <!-- Primary Meta Tags (placeholders; final copy and preview image come in M13) -->
  <title>Surya K - Portfolio</title>
  <meta name="title" content="Surya K - Portfolio">
  <meta name="description" content="Surya K's interactive portfolio. Work in progress.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Surya K - Portfolio">
  <meta property="og:description" content="Surya K's interactive portfolio. Work in progress.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Surya K - Portfolio">
  <meta name="twitter:description" content="Surya K's interactive portfolio. Work in progress.">

  <link rel="icon" href="../static/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../static/images/favicon.png">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
</body>

</html>
